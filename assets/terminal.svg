<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" style="white-space:pre">
  <defs>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="20" y1="230" x2="840" y2="230">
      <stop offset="0" stop-color="#7F5AF0"/>
      <stop offset="0.5" stop-color="#2CB67D"/>
      <stop offset="1" stop-color="#7AA2F7"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 430 240" to="360 430 240" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="typing">
      <rect x="44" y="96" height="24" width="40">
        <animate attributeName="width" begin="0.6s" dur="0.9s" fill="freeze" calcMode="discrete"
                 values="40;48;57;65;74;82;91;99;108;118"/>
      </rect>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- waybar -->
  <rect x="20" y="10" width="820" height="32" rx="10" fill="#16161E" stroke="#26263A"/>
  <circle cx="44" cy="26" r="5" fill="#7F5AF0"/>
  <circle cx="62" cy="26" r="4" fill="none" stroke="#565F89" stroke-width="1.5"/>
  <circle cx="78" cy="26" r="4" fill="none" stroke="#565F89" stroke-width="1.5"/>
  <circle cx="94" cy="26" r="4" fill="none" stroke="#565F89" stroke-width="1.5"/>
  <text x="430" y="31" fill="#A9B1D6" text-anchor="middle" font-size="13">arjun@arch</text>
  <text x="742" y="31" fill="#565F89" font-size="13">♫</text>
  <g fill="#2CB67D">
    <rect x="760" y="20" width="4" height="12" rx="1"><animate attributeName="height" values="4;12;6;10;4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="28;20;26;22;28" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="767" y="20" width="4" height="12" rx="1"><animate attributeName="height" values="10;4;12;5;10" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="22;28;20;27;22" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="774" y="20" width="4" height="12" rx="1"><animate attributeName="height" values="6;11;4;12;6" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="26;21;28;20;26" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="781" y="20" width="4" height="12" rx="1"><animate attributeName="height" values="12;6;9;4;12" dur="1s" repeatCount="indefinite"/><animate attributeName="y" values="20;26;23;28;20" dur="1s" repeatCount="indefinite"/></rect>
  </g>
  <text x="800" y="31" fill="#A9B1D6" font-size="13">01:11</text>

  <!-- window -->
  <rect x="20" y="56" width="820" height="352" rx="12" fill="url(#border)" opacity="0.35" filter="url(#glow)"/>
  <rect x="20" y="56" width="820" height="352" rx="12" fill="#0F0F17" stroke="url(#border)" stroke-width="2"/>

  <!-- prompt -->
  <text x="44" y="113" clip-path="url(#typing)" xml:space="preserve"><tspan fill="#7AA2F7">~</tspan> <tspan fill="#2CB67D">❯</tspan> <tspan fill="#C0CAF5">fastfetch</tspan></text>

  <!-- output -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="1.8s" fill="freeze"/>
    <g fill="#1793D1" font-weight="bold" xml:space="preserve">
      <text x="48" y="158">&#160;&#160;&#160;&#160;&#160;&#160;&#160;/\</text>
      <text x="48" y="178">&#160;&#160;&#160;&#160;&#160;&#160;/&#160;&#160;\</text>
      <text x="48" y="198">&#160;&#160;&#160;&#160;&#160;/\&#160;&#160;&#160;\</text>
      <text x="48" y="218">&#160;&#160;&#160;&#160;/&#160;&#160;&#160;&#160;&#160;&#160;\</text>
      <text x="48" y="238">&#160;&#160;&#160;/&#160;&#160;&#160;,,&#160;&#160;&#160;\</text>
      <text x="48" y="258">&#160;&#160;/&#160;&#160;&#160;|&#160;&#160;|&#160;&#160;-\</text>
      <text x="48" y="278">&#160;/_-''&#160;&#160;&#160;&#160;''-_\</text>
    </g>
  </g>

  <g xml:space="preserve">
    <g opacity="0"><set attributeName="opacity" to="1" begin="1.9s" fill="freeze"/>
      <text x="220" y="148" font-weight="bold"><tspan fill="#7F5AF0">arjun</tspan><tspan fill="#C0CAF5">@</tspan><tspan fill="#7F5AF0">github</tspan></text>
      <text x="220" y="168" fill="#3B3B55">────────────────────────────────────────</text>
    </g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.0s" fill="freeze"/>
      <text x="220" y="190"><tspan fill="#2CB67D">os</tspan><tspan x="300" fill="#C0CAF5">arch linux · omarchy</tspan></text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.1s" fill="freeze"/>
      <text x="220" y="210"><tspan fill="#2CB67D">wm</tspan><tspan x="300" fill="#C0CAF5">hyprland</tspan></text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.2s" fill="freeze"/>
      <text x="220" y="230"><tspan fill="#2CB67D">editor</tspan><tspan x="300" fill="#C0CAF5">neovim</tspan></text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.3s" fill="freeze"/>
      <text x="220" y="250"><tspan fill="#2CB67D">stack</tspan><tspan x="300" fill="#C0CAF5">python · typescript · next.js · mongodb</tspan></text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>
      <text x="220" y="270"><tspan fill="#2CB67D">ai</tspan><tspan x="300" fill="#C0CAF5">on daily. it types, i decide.</tspan></text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.5s" fill="freeze"/>
      <text x="220" y="290"><tspan fill="#2CB67D">status</tspan><tspan x="300" fill="#C0CAF5">building something</tspan><tspan fill="#7F5AF0"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>...</tspan></text></g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/>
      <text x="220" y="310"><tspan fill="#2CB67D">rice</tspan><tspan x="300" fill="#C0CAF5">self-made, see below ↓</tspan></text></g>
  </g>

  <!-- palette -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="2.8s" fill="freeze"/>
    <rect x="220" y="328" width="28" height="14" rx="3" fill="#15161E"/>
    <rect x="252" y="328" width="28" height="14" rx="3" fill="#F7768E"/>
    <rect x="284" y="328" width="28" height="14" rx="3" fill="#2CB67D"/>
    <rect x="316" y="328" width="28" height="14" rx="3" fill="#E0AF68"/>
    <rect x="348" y="328" width="28" height="14" rx="3" fill="#7AA2F7"/>
    <rect x="380" y="328" width="28" height="14" rx="3" fill="#7F5AF0"/>
    <rect x="412" y="328" width="28" height="14" rx="3" fill="#7DCFFF"/>
    <rect x="444" y="328" width="28" height="14" rx="3" fill="#C0CAF5"/>
  </g>

  <!-- final prompt + cursor -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="3.0s" fill="freeze"/>
    <text x="44" y="378" xml:space="preserve"><tspan fill="#7AA2F7">~</tspan> <tspan fill="#2CB67D">❯</tspan></text>
    <rect x="78" y="365" width="9" height="17" fill="#C0CAF5">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
